[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnina-vs"
version = "1.1.0"
description = "A modular virtual-screening pipeline built around Gnina: protein prep, ligand prep, active-site detection, parallel docking, results reporting, and an optional metabolite-aware docking mode (BioTransformer + comparison + annotation + figures)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mohammed Fouad Mohammed" },
]
keywords = ["virtual screening", "docking", "gnina", "cheminformatics", "drug discovery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "rdkit>=2022.9",
    "pandas>=1.5",
    "openpyxl>=3.0",
    "tqdm>=4.60",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# 'gnina-vs metabolite-run' needs its config parsed and (optionally) its
# ligands protonated for pH 7.4; BioTransformer itself is a separate Java
# jar (https://bitbucket.org/wishartlab/biotransformer3.0/), not pip-installable.
metabolism = ["pyyaml>=6.0", "dimorphite-dl>=1.2.4"]
# Optional ADMET-AI predictions (Phase 6 annotations); skipped gracefully,
# with admet_status saying so, if absent. Not verified against a real
# install in this environment.
annotate = ["admet-ai"]
# Applicability-domain check for those predictions (Phase 6, ad_* columns).
# scikit-fingerprints supplies the k-NN domain checker; PyTDC is needed only
# once, by `gnina-vs fetch-ad-reference`, to assemble the reference set from
# ADMET-AI's TDC training data. Without them the ad_* columns stay empty with
# the reason in ad_status. The TDC download path is unverified -- see README.
applicability = ["scikit-fingerprints>=1.10", "PyTDC"]
# Parquet output for the three-grain tables (Phase 6b). Without pyarrow the
# tables are written as CSV only, with a warning: a CSV round-trip degrades
# booleans to strings and makes a missing value indistinguishable from an
# empty one, which is why Parquet is the authoritative copy.
tables = ["pyarrow>=14"]
# Phase 7 figures (metabolic tree, bar chart, heatmap, MW scatter).
figures = ["matplotlib>=3.5"]

[project.scripts]
gnina-vs = "gnina_vs.cli:main"

[project.urls]
Homepage = "https://github.com/Mohaammed-Fouad/gnina-vs"
Issues = "https://github.com/Mohaammed-Fouad/gnina-vs/issues"

[tool.setuptools.packages.find]
where = ["src"]
