[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnina-vs"
version = "1.0.0"
description = "A modular virtual-screening pipeline built around Gnina: protein prep, ligand prep, active-site detection, parallel docking, and results reporting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mohammed Fouad Mohammed" },
]
keywords = ["virtual screening", "docking", "gnina", "cheminformatics", "drug discovery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "rdkit>=2022.9",
    "pandas>=1.5",
    "openpyxl>=3.0",
    "tqdm>=4.60",
    "scipy>=1.9",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gnina-vs = "gnina_vs.cli:main"

[project.urls]
Homepage = "https://github.com/Mohaammed-Fouad/gnina-vs"
Issues = "https://github.com/Mohaammed-Fouad/gnina-vs/issues"

[tool.setuptools.packages.find]
where = ["src"]
